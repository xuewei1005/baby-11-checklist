="openEdit()">＋ 添加</button></div>${c.notes?`<p class="category-note-text">${esc(c.notes)}</p>`:''}${c.items.length?c.items.map((it,j)=>`<article class="card"><div class="row"><button class="check ${it.status==='已完成'?'done':''}" aria-label="${esc(it.name)}：${it.status==='已完成'?'标为未准备':'标为已完成'}" onclick="toggleDone(${j})">${it.status==='已完成'?'✓':''}</button><div class="content"><div class="item-title">${esc(it.name)}</div>${it.qty?`<div class="qty">${esc(it.qty)}</div>`:''}</div><button class="editbtn" aria-label="编辑 ${esc(it.name)}" onclick="openEdit(${j})">···</button></div><div class="item-foot"><label class="note-wrap"><span>备注</span><input aria-label="${esc(it.name)}的备注" value="${esc(it.note)}" placeholder="添加备注" onchange="setNote(${j},this.value)"></label><button class="status ${it.status==='准备中'?'doing':it.status==='已完成'?'done':''}" onclick="cycle(${j})" aria-label="${esc(it.name)} 当前${esc(it.status)}，点击更改状态">${esc(it.status)} ▾</button></div></article>`).join(''):'<div class="empty">还没有物品，点击添加</div>'}`}
function switchTab(i){active=i;render();document.querySelector('.tab.active')?.scrollIntoView({block:'nearest',inline:'nearest'});let y=document.getElementById('content').getBoundingClientRect().top+window.scrollY-document.querySelector('.sticky-nav').offsetHeight-10;window.scrollTo({top:Math.max(0,y),behavior:'instant'})}function toggleDone(j){let x=db[active].items[j];x.status=x.status==='已完成'?'未准备':'已完成';persist();render()}function cycle(j){let x=db[active].items[j],s=['未准备','准备中','已完成'];x.status=s[(s.indexOf(x.status)+1)%3];persist();render()}function setNote(j,v){db[active].items[j].note=v;persist()}function setCatNote(v){db[active].notes=v;persist()}function openEdit(j=null){editing=j;let x=j===null?{name:'',qty:'',status:'未准备'}:db[active].items[j];document.getElementById('dialog-title').textContent=j===null?'添加物品':'编辑物品';document.getElementById('item-name').value=x.name;document.getElementById('item-qty').value=x.qty;document.getElementById('item-status').value=x.status;document.getElementById('delete').hidden=j===null;dialog.showModal()}document.getElementById('form').onsubmit=e=>{e.preventDefault();let name=document.getElementById('item-name').value.trim();if(!name)return;let x=editing===null?{id:'custom-'+Date.now(),note:''}:db[active].items[editing];x.name=name;x.qty=document.getElementById('item-qty').value;x.status=document.getElementById('item-status').value;if(editing===null)db[active].items.push(x);persist();dialog.close();render()};document.getElementById('delete').onclick=()=>{if(confirm('确定删除这件物品及其备注吗？')){db[active].items.splice(editing,1);persist();dialog.close();render()}};function toggleMenu(force){const menu=document.getElementById('menu');menu.hidden=typeof force==='boolean'?!force:!menu.hidden;document.getElementById('more-button').setAttribute('aria-expanded',String(!menu.hidden))}document.addEventListener('click',e=>{if(!e.target.closest('.top'))toggleMenu(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleMenu(false)});function addCategory(){let n=prompt('分类名称');if(n?.trim()){db.push({name:n.trim(),notes:'',items:[]});active=db.length-1;persist();render()}toggleMenu(false)}function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:5,exported:new Date().toISOString(),categories:db},null,2)],{type:'application/json'}));a.href=u;a.download='小11待产清单.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toggleMenu(false)}async function importData(e){try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.categories)||!d.categories.every(c=>Array.isArray(c.items)))throw Error();if(confirm('导入会替换当前清单，确定继续吗？')){db=d.categories;active=0;persist();render()}}catch{alert('无法读取这个备份文件')}e.target.value='';toggleMenu(false)}render();

const localOnly=location.hostname.endsWith('.github.io');let cloudETag=null,dirty=false,sending=false,blocked=false,saveTimer=null;
const statusEl=document.getElementById('sync-status');
function status(t,b=false){statusEl.textContent=t;statusEl.classList.toggle('problem',b)}
async function requestCloud(method,body){const o={method,cache:'no-store',headers:{'Content-Type':'application/json'}};if(body)o.body=JSON.stringify(body);let r=await fetch('/.netlify/functions/checklist',o),x=await r.json();if(!r.ok&&r.status!==409)throw Error(x.error||'网络错误');return {code:r.status,...x}}
async function startCloud(){try{let r=await requestCloud('GET');if(!r.exists){r=await requestCloud('POST',{data:INITIAL,etag:null});if(r.code===409)r=await requestCloud('GET')}if(!r.data||!r.etag)throw Error('无云端数据');let pending=JSON.parse(localStorage.getItem(KEY+'-pending')||'null');cloudETag=r.etag;if(pending){dirty=true;if(pending.base!==cloudETag){blocked='conflict';status('同步冲突 · 点击处理',true)}else{status('正在同步本机修改…');setTimeout(flushCloud,0)}}else{db=r.data;localStorage.setItem(KEY,JSON.stringify(db));render();status('已连接 · 云端同步')}document.body.classList.remove('sync-loading')}catch(e){status('云端连接失败，点击重试',true);blocked='startup';document.body.classList.remove('sync-loading')}}
function scheduleCloudSave(){if(localOnly)return;dirty=true;localStorage.setItem(KEY+'-pending',JSON.stringify({base:cloudETag}));clearTimeout(saveTimer);if(!blocked)saveTimer=setTimeout(()=>{saveTimer=null;flushCloud()},300)}
async function flushCloud(){if(sending||!dirty||blocked)return;if(!cloudETag){status('尚未连接云端，修改保留在本机',true);blocked='startup';return}sending=true;dirty=false;let snapshot=structuredClone(db);status('正在同步…');try{let r=await requestCloud('POST',{data:snapshot,etag:cloudETag});if(r.code===409){dirty=true;blocked='conflict';status('同步冲突 · 点击处理',true);return}cloudETag=r.etag;if(dirty)localStorage.setItem(KEY+'-pending',JSON.stringify({base:cloudETag}));else localStorage.removeItem(KEY+'-pending');status('已连接 · 云端同步')}catch{dirty=true;status('网络异常 · 自动重试',true);saveTimer=setTimeout(()=>{saveTimer=null;flushCloud()},5000)}finally{sending=false;if(dirty&&!blocked&&!saveTimer)saveTimer=setTimeout(()=>{saveTimer=null;flushCloud()},300)}}
async function pollCloud(){if(blocked||dirty||sending||document.hidden||document.activeElement?.matches('input,textarea,select')||document.querySelector('dialog[open]'))return;try{let r=await requestCloud('GET');if(r.etag&&r.etag!==cloudETag){cloudETag=r.etag;db=r.data;localStorage.setItem(KEY,JSON.stringify(db));render()}status('已连接 · 云端同步')}catch{status('网络异常 · 正在重试',true)}}
async function resolveConflict(){if(blocked==='conflict'){if(confirm('另一台设备刚刚修改了清单。确定先导出本机修改并载入云端版本吗？')){exportData();try{let r=await requestCloud('GET');db=r.data;cloudETag=r.etag;dirty=false;blocked=false;localStorage.removeItem(KEY+'-pending');localStorage.setItem(KEY,JSON.stringify(db));render();status('已连接 · 云端同步')}catch{status('读取云端失败，请点击重试',true)}}}else if(blocked==='startup'){if(dirty){if(!confirm('本机有尚未同步的修改。确定先导出备份，再连接云端吗？'))return;exportData()}blocked=false;document.body.classList.add('sync-loading');startCloud()}}
if(localOnly){statusEl.hidden=true;document.body.classList.remove('sync-loading')}else{setInterval(pollCloud,5000);window.addEventListener('online',()=>{if(dirty&&!blocked)flushCloud();else if(!blocked)pollCloud()});startCloud()}
</script></body></html>
